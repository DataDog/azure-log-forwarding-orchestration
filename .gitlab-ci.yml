include:
  - local: .adms/go/gitlab.yaml
  - local: .adms/python/gitlab.yaml
variables:
  PR_COMMENTER_IMAGE: registry.ddbuild.io/images/pr-commenter:3-jammy
  DOCKER_IMAGE: 486234852809.dkr.ecr.us-east-1.amazonaws.com/docker:24.0.4-gbi-focal
  CI_IMAGE: registry.ddbuild.io/ci/azure-log-forwarding-orchestration-ci:latest
  INTERNAL_DOCKER_REGISTRY: registry.ddbuild.io/lfo
  PUBLIC_DOCKER_REGISTRY: datadoghq.azurecr.io
  QA_DOCKER_REGISTRY: lfoqa.azurecr.io
stages:
  - ci-image
  - test
  - build
  - publish-qa
  - publish
  - publish-task-images-manifest
# Shared job definition for publishing images via dd-pkg publish-image (artifact-gateway)
.docker_publish_job_definition:
  image: registry.ddbuild.io/agent-delivery/dd-pkg:v0.9.0
  tags: ["arch:arm64"]
  variables:
    IMG_SIGNING: "false"
    PUBLIC_IMAGES_PUBLISH_TIMEOUT: "1800"
  script:
    - |
      set -euo pipefail
      dd-pkg version
      args=(publish-image --timeout "${PUBLIC_IMAGES_PUBLISH_TIMEOUT}" --poll-interval 30 --signing="${IMG_SIGNING}")
      if [[ -n "${IMG_REGISTRIES:-}" ]]; then args+=(--registries "${IMG_REGISTRIES}"); fi
      if [[ -n "${IMG_SOURCES:-}" ]]; then args+=(--sources "${IMG_SOURCES}"); fi
      if [[ -n "${IMG_DESTINATIONS:-}" ]]; then args+=(--destinations "${IMG_DESTINATIONS}"); fi
      if [[ -n "${IMG_DESTINATIONS_REGEX:-}" ]]; then args+=(--regex-expression "${IMG_DESTINATIONS_REGEX}"); fi
      if [[ -n "${IMG_DESTINATIONS_REGEX_REPL:-}" ]]; then args+=(--regex-replacement "${IMG_DESTINATIONS_REGEX_REPL}"); fi
      if [[ -n "${IMG_TAG_REFERENCE:-}" ]]; then args+=(--tag-reference "${IMG_TAG_REFERENCE}"); fi
      if [[ -n "${IMG_NEW_TAGS:-}" ]]; then args+=(--new-tags "${IMG_NEW_TAGS}"); fi
      dd-pkg "${args[@]}"
# ------------- CI IMAGE -------------
# Rebuilds the CI image used by all other jobs; run manually when ci/build-image/Dockerfile changes
ci-build-image:
  image: $DOCKER_IMAGE
  stage: ci-image
  rules:
    - when: manual
      allow_failure: true
  tags: ["arch:amd64"]
  script:
    - docker buildx build --platform linux/amd64 --tag "$CI_IMAGE" -f
      "ci/build-image/Dockerfile" . --push
# ------------- CONTROL PLANE -------------
# Runs the control plane Python test suite and uploads a coverage report artifact
control-plane-tests:
  image: $CI_IMAGE
  stage: test
  tags: ["arch:amd64"]
  script:
    - ci/scripts/control_plane/test.sh
  artifacts:
    paths:
      - ci/control_plane_coverage.md
# Verifies that all control plane dependencies are pinned and consistent
control-plane-test-dependencies:
  image: $CI_IMAGE
  stage: test
  tags: ["arch:amd64"]
  script:
    - ci/scripts/control_plane/test-dependencies.sh
# Checks that control plane Python code is formatted with ruff
control-plane-formatting:
  image: $CI_IMAGE
  stage: test
  tags: ["arch:amd64"]
  script:
    - ci/scripts/control_plane/format.sh
# Lints control plane Python code with ruff
control-plane-lint:
  image: $CI_IMAGE
  stage: test
  tags: ["arch:amd64"]
  script:
    - ci/scripts/control_plane/lint.sh
